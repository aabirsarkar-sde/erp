# Runs on every push and pull request. Vercel deploys separately; a red CI means don't merge.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        edition: [crm, helpdesk]
    env:
      APP_EDITION: ${{ matrix.edition }}
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DATABASE_URL: file:ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
